name: Sunset alert cron

# Manual trigger for /api/cron (Actions tab → Run workflow), e.g. for testing.
# The hourly schedule runs on cron-job.org: GitHub's scheduled runs were
# delayed by hours, so alerts missed the 2–3 h window before sunset.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repo secrets must be set." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron")
          echo "HTTP $code"
          cat /tmp/cron-body
          echo
          [ "$code" = "200" ]
